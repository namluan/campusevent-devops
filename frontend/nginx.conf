server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Une route /api qui arrive ici veut dire que la gateway est mal configuree :
  # mieux vaut un 404 clair que la page HTML.
  location /api/ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
