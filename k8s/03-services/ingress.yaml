apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusevents
  namespace: campusevents
spec:
  ingressClassName: nginx
  rules:
    - host: campusevents.localhost
      http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  name: http
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: bookings-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
