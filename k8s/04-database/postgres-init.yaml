# Execute une seule fois, quand le volume est vide : une base et un utilisateur par service.
# Meme contenu que compose/init-databases.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: campusevents
data:
  init-databases.sh: |
    #!/bin/sh
    set -eu

    create_database() {
      psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -v name="$1" -v pass="$2" <<'SQL'
    CREATE USER :"name" PASSWORD :'pass';
    CREATE DATABASE :"name" OWNER :"name";
    REVOKE CONNECT ON DATABASE :"name" FROM PUBLIC;
    SQL
    }

    create_database events_db "$EVENTS_DB_PASSWORD"
    create_database bookings_db "$BOOKINGS_DB_PASSWORD"
