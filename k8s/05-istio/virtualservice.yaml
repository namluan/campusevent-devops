apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: campusevents
  namespace: campusevents
spec:
  hosts:
    - "*"
  gateways:
    - campusevents-gateway  
  http:
    - match:
        - uri:
            prefix: /api/events
      route:
        - destination:
            host: events-service
            port:
              number: 3001
    - match:
        - uri:
            prefix: /api/bookings
      route:
        - destination:
            host: bookings-service
            port:
              number: 3002
    - route:                
        - destination:
            host: frontend
            port:
              number: 80