name: CI - events-service

on:
  push:
    branches: [main]
    paths:
      - 'services/events-service/**'
      - 'proto/**'
      - 'package*.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.dockerignore'
      - '.github/workflows/ci-events.yml'
  # Pas de filtre « paths » ici : un contrôle obligatoire qui ne démarre pas bloque la PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/events-service

jobs:
  test:
    name: Events tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/events-service/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix services/events-service

      - name: Run tests
        working-directory: services/events-service
        run: |
          mkdir -p build
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: events-test-report
          path: services/events-service/build/junit.xml
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Events quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lint tools
        run: npm ci

      # Le rapport n'est pas bloquant : c'est l'étape suivante qui décide.
      - name: Write ESLint report
        run: npx eslint services/events-service --format html --output-file build/eslint.html || true

      - name: Run ESLint and Prettier
        run: npm run lint:events

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: events-quality-report
          path: build/eslint.html
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Events Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Sur une PR, l'image est construite mais jamais publiée.
      - name: Build (and push on main only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/events-service/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=events-service
          cache-to: type=gha,scope=events-service,mode=max
